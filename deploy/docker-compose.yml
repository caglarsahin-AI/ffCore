# FFCore altyapı ve uygulama servisleri. Depo kökünden: docker compose up -d
# Tüm imajlar ${REGISTRY_PREFIX} önekli ve sabit sürümlü (:latest yok).
# Göreli yollar depo köküne göredir (compose.yaml include, project_directory: .).
# Dışarıya yalnızca backend ve frontend port yayınlar (SECURITY_AND_PERMISSIONS).
# Zorunlu değişkenler ${VAR:?...} ile tanımlı; eksikse compose açık hatayla durur.

x-langfuse-env: &langfuse-env
  NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
  DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER:-langfuse}:${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD tanımlı değil}@langfuse-postgres:5432/${LANGFUSE_POSTGRES_DB:-langfuse}
  SALT: ${LANGFUSE_SALT:?LANGFUSE_SALT tanımlı değil}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?LANGFUSE_ENCRYPTION_KEY tanımlı değil}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD tanımlı değil}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-minio}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD tanımlı değil}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${LANGFUSE_MINIO_USER:-minio}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD tanımlı değil}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD tanımlı değil}

x-langfuse-depends: &langfuse-depends
  langfuse-postgres:
    condition: service_healthy
  langfuse-clickhouse:
    condition: service_healthy
  langfuse-minio:
    condition: service_healthy
  langfuse-redis:
    condition: service_healthy

# Application environment shared by the backend, workers, migrate and the MCP services.
x-app-env: &app-env
  DEPLOY_PROFILE: ${DEPLOY_PROFILE:?DEPLOY_PROFILE tanımlı değil}
  INFERENCE_BACKEND: ${INFERENCE_BACKEND:?INFERENCE_BACKEND tanımlı değil}
  # 04a /readyz compares it with the Ollama models' context_tokens (C13).
  OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
  VECTOR_BACKEND: ${VECTOR_BACKEND:?VECTOR_BACKEND tanımlı değil}
  QDRANT_URL: ${QDRANT_URL:-}
  # 04a knowledge base (defaults = measured values, .env.example)
  EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
  RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
  RERANK_MIN_SCORE: ${RERANK_MIN_SCORE:-0.1}
  # Deterministic stand-in embedding/rerank models for console e2e without weights
  # (10b-poc-1, K-10bp-0002 D2). Off by default; /readyz names it when on.
  FAKE_EMBED: ${FAKE_EMBED:-0}
  # The approval sweep test hook (FOLLOWUP-111, docs/onaylar.md); off unless a test stack
  # sets it. The hook runs in the backend; the workers share this block but do not read it.
  FFCORE_TEST_HOOKS: ${FFCORE_TEST_HOOKS:-0}
  CONVERT_TIMEOUT_SECONDS: ${CONVERT_TIMEOUT_SECONDS:-600}
  CONVERT_WORKER_START_TIMEOUT_SECONDS: ${CONVERT_WORKER_START_TIMEOUT_SECONDS:-60}
  OCR_PDF_MAX_PAGES: ${OCR_PDF_MAX_PAGES:-200}
  # Converter process and upload limits (review r1 MAJOR-5; measured values in config.py).
  # Offline by default in both profiles (review r1 MAJOR-6, K-04a-0020): weights come only
  # from `make models`, never from a loader at run time.
  HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
  TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
  CONVERT_MEMORY_LIMIT_MB: ${CONVERT_MEMORY_LIMIT_MB:-10240}
  CONVERT_CPU_LIMIT_SECONDS: ${CONVERT_CPU_LIMIT_SECONDS:-3600}
  UPLOAD_MAX_REQUEST_BYTES: ${UPLOAD_MAX_REQUEST_BYTES:-541065216}
  ALLOWED_LANGUAGES: ${ALLOWED_LANGUAGES:-tr,en}
  ARQ_QUEUE_INGEST: ${ARQ_QUEUE_INGEST:-ingest}
  OFFLINE: ${OFFLINE:?OFFLINE tanımlı değil}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is not set}
  OBO_JWT_SECRET: ${OBO_JWT_SECRET:?OBO_JWT_SECRET is not set}
  EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
  ALLOWED_INTERNAL_HOSTS: ${ALLOWED_INTERNAL_HOSTS:-}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set}
  FERNET_KEY: ${FERNET_KEY:?FERNET_KEY is not set}
  EMBED_DIM: ${EMBED_DIM:?EMBED_DIM is not set}
  CONSOLE_ORIGINS: ${CONSOLE_ORIGINS:-}
  SESSION_TTL_S: ${SESSION_TTL_S:-28800}
  GUARDRAIL_EGRESS_ENABLED: ${GUARDRAIL_EGRESS_ENABLED:?GUARDRAIL_EGRESS_ENABLED is not set}
  PII_TOKEN_TTL_S: ${PII_TOKEN_TTL_S:-1800}
  LITELLM_URL: ${LITELLM_URL:-}
  LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is not set}
  LITELLM_INTERNAL_KEY: ${LITELLM_INTERNAL_KEY:?LITELLM_INTERNAL_KEY is not set}
  LLM_CALL_TIMEOUT_S: ${LLM_CALL_TIMEOUT_S:-60}
  # 06a agent runtime: profile values (.env.example lists llmaas and airgap).
  LLM_SLOTS: ${LLM_SLOTS:-4}
  BACKGROUND_WINDOW: ${BACKGROUND_WINDOW:-}
  BACKGROUND_WINDOW_WEEKENDS: ${BACKGROUND_WINDOW_WEEKENDS:-false}
  BACKGROUND_WINDOW_TZ: ${BACKGROUND_WINDOW_TZ:-Europe/Istanbul}
  RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-120}
  RUN_ABANDON_GRACE_S: ${RUN_ABANDON_GRACE_S:-120}
  # 03c API keys: failed attempts per client address per minute; last_used_at write buffer.
  API_KEY_AUTH_FAILURES_PER_MIN: ${API_KEY_AUTH_FAILURES_PER_MIN:-20}
  API_KEY_LAST_USED_FLUSH_S: ${API_KEY_LAST_USED_FLUSH_S:-60}
  # 03c retention and alerts: dry run by default, audit partitions need the second flag.
  RETENTION_DRY_RUN: ${RETENTION_DRY_RUN:-true}
  RETENTION_AUDIT_DROP_ENABLED: ${RETENTION_AUDIT_DROP_ENABLED:-false}
  RETENTION_BATCH: ${RETENTION_BATCH:-5000}
  ALERT_SERVICE_DOWN_S: ${ALERT_SERVICE_DOWN_S:-300}
  RUN_EVENT_STREAM_TTL_S: ${RUN_EVENT_STREAM_TTL_S:-86400}
  ARQ_QUEUE_INTERACTIVE: ${ARQ_QUEUE_INTERACTIVE:-llm-interactive}
  ARQ_QUEUE_BACKGROUND: ${ARQ_QUEUE_BACKGROUND:-llm-background}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LANGFUSE_HOST: http://langfuse-web:3000
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?LANGFUSE_INIT_PROJECT_PUBLIC_KEY is not set}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?LANGFUSE_INIT_PROJECT_SECRET_KEY is not set}

services:
  postgres:
    image: ${REGISTRY_PREFIX}pgvector/pgvector:0.8.1-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER tanımlı değil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD tanımlı değil}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB tanımlı değil}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: ${REGISTRY_PREFIX}redis:7.4.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD tanımlı değil}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD tanımlı değil}

  qdrant:
    # 04a: second vector driver (VECTOR_BACKEND=qdrant; PayCore's primary). Optional:
    # COMPOSE_PROFILES=qdrant, or give QDRANT_URL of an existing server instead. Same version as
    # PayCore's server (v1.11.3); pinned by index digest. No port is published (internal only).
    image: ${REGISTRY_PREFIX}qdrant/qdrant:v1.11.3@sha256:da426bb8aa0ba0a3032b3110e71d0d1516d51a686aa17b39bde4e090ce3b8e7c
    profiles: ["qdrant"]
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ${REGISTRY_PREFIX}ghcr.io/berriai/litellm:v1.80.0-stable
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY tanımlı değil}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?LITELLM_SALT_KEY tanımlı değil}
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      STORE_MODEL_IN_DB: "True"
      # The admin UI stays off; models come from FFCore's tables only (01).
      DISABLE_ADMIN_UI: "True"
      # 02: Langfuse callback, same project keys as the backend (one source: LANGFUSE_INIT_*).
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?LANGFUSE_INIT_PROJECT_PUBLIC_KEY is not set}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?LANGFUSE_INIT_PROJECT_SECRET_KEY is not set}
    volumes:
      - ./deploy/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # İlk açılışta DB migration'ı birkaç dakika sürer; `up --wait` bunu bekler.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/health/liveliness || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 60

  langfuse-web:
    image: ${REGISTRY_PREFIX}langfuse/langfuse:3.120.0
    restart: unless-stopped
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?LANGFUSE_NEXTAUTH_SECRET tanımlı değil}
      # 02: headless first install (organisation, project, key pair, admin user); idempotent.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-ffcore}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-FFCore}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-ffcore}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-FFCore}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?LANGFUSE_INIT_PROJECT_PUBLIC_KEY is not set}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?LANGFUSE_INIT_PROJECT_SECRET_KEY is not set}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?LANGFUSE_INIT_USER_EMAIL is not set}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-FFCore admin}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?LANGFUSE_INIT_USER_PASSWORD is not set}
    depends_on: *langfuse-depends
    healthcheck:
      # Langfuse localhost'a değil konteyner adına bağlanır (Next.js HOSTNAME).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 60

  langfuse-worker:
    image: ${REGISTRY_PREFIX}langfuse/langfuse-worker:3.120.0
    restart: unless-stopped
    environment: *langfuse-env
    depends_on: *langfuse-depends

  langfuse-postgres:
    image: ${REGISTRY_PREFIX}postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:-langfuse}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?LANGFUSE_POSTGRES_PASSWORD tanımlı değil}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:-langfuse}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\""]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-clickhouse:
    image: ${REGISTRY_PREFIX}clickhouse/clickhouse-server:25.8.2.29
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${LANGFUSE_CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?LANGFUSE_CLICKHOUSE_PASSWORD tanımlı değil}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-minio:
    # DECISION-23 (A): resmi minio/minio Docker Hub'da erişilemez; chainguard MinIO digest ile pinli.
    # Chainguard ücretsiz katmanı yalnızca latest yayınlar; digest güncellemesi elle (12 aynaya alır).
    # cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    image: ${REGISTRY_PREFIX}cgr.dev/chainguard/minio@sha256:e70b2b1e74d79457f808710483bd726ff364529ca30736eaa15a6ab547d3a5a7
    restart: unless-stopped
    # İmajda sh, mc ve minio var (doğrulandı); bucket resmi Langfuse compose'u gibi açılışta oluşturulur.
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /data/langfuse && exec minio server /data --address :9000 --console-address :9001"]
    environment:
      MINIO_ROOT_USER: ${LANGFUSE_MINIO_USER:-minio}
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD:?LANGFUSE_MINIO_PASSWORD tanımlı değil}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: ${REGISTRY_PREFIX}redis:7.4.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD tanımlı değil}"]
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD:?LANGFUSE_REDIS_PASSWORD tanımlı değil}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    build:
      context: ./backend
      target: runtime
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    restart: unless-stopped
    # The shared block lives in x-app-env (top); the backend adds itself to the internal
    # hosts: `ingest-raw` runs here and embeds over HTTP through the API (FOLLOWUP-154).
    environment:
      <<: *app-env
      ALLOWED_INTERNAL_HOSTS: backend,${ALLOWED_INTERNAL_HOSTS:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 04a: model weights (bge-m3, reranker); downloaded once, never baked into the image.
      - model_cache:/models
      # 04a: raw and silver layers of the knowledge bases (gold is in Postgres).
      - knowledge_storage:/data/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 01: the start-up reconcile needs LiteLLM; its first start migrates for minutes. If LiteLLM
      # goes down later the backend stays up and retries (01 S4).
      litellm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    # 04a ingest worker (arq, queue `ingest`): converts in a bounded process pool, gates,
    # chunks and asks the backend for embeddings; it never loads the embedding model (C10).
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    command: ["arq", "ffcore.knowledge.worker.WorkerSettings"]
    restart: unless-stopped
    # Container memory budget (review r1 MAJOR-5): the converter process peaked at 2.3 GB
    # resident with Docling, 1.7 GB with PaddleOCR (2026-10-29), plus the arq process. Past it
    # the kernel kills the converter, the file is `worker_died` and a fresh process goes on.
    mem_limit: ${WORKER_MEM_LIMIT:-6g}
    environment:
      <<: *app-env
      INTERNAL_API_URL: http://backend:8000
      ALLOWED_INTERNAL_HOSTS: backend,${ALLOWED_INTERNAL_HOSTS:-}
    volumes:
      # Docling and PaddleOCR weights; raw/silver written here, read by the backend.
      - model_cache:/models
      - knowledge_storage:/data/storage
    depends_on:
      backend:
        condition: service_healthy

  mcp-search:
    # 05a: MCP server search_documents (C7). Relays the caller's on-behalf-of token to the
    # backend's knowledge search; no signing key, no database (K-05a-0002 S3): its environment
    # is listed here, not the app-env anchor. Internal network only.
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    command: ["python", "-m", "ffcore.services.mcp_search_server"]
    restart: unless-stopped
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    environment: &mcp-env
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is not set}
      OFFLINE: ${OFFLINE:?OFFLINE tanımlı değil}
      ALLOWED_INTERNAL_HOSTS: backend
      INTERNAL_API_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck: &mcp-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy

  mcp-sql:
    # 05a: MCP server get_schema / run_sql (C7) on the demo database (13a), read-only login
    # user (`make seed-sql-demo`, K-05a-0002 S5). Same rules as mcp-search.
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    command: ["python", "-m", "ffcore.services.mcp_sql_server"]
    restart: unless-stopped
    mem_limit: ${MCP_MEM_LIMIT:-512m}
    environment:
      <<: *mcp-env
      SQL_DEMO_DATABASE_URL: postgresql://mcp_sql:${AGENT_DEMO_DB_PASSWORD:?AGENT_DEMO_DB_PASSWORD is not set}@postgres:5432/agent_demo
      SQL_MAX_ROWS: ${SQL_MAX_ROWS:-500}
      SQL_TIMEOUT_S: ${SQL_TIMEOUT_S:-20}
    healthcheck: *mcp-health
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy

  agent-worker:
    # 06a agent runs (arq, queue llm-interactive): chat and the console's test panel. The model
    # slot pool (LLM_SLOTS, Redis) is the real limit across both agent workers (C10).
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    command: ["arq", "ffcore.runtime.worker.InteractiveWorker"]
    restart: unless-stopped
    environment: &agent-env
      <<: *app-env
      INTERNAL_API_URL: http://backend:8000
      ALLOWED_INTERNAL_HOSTS: backend,litellm,langfuse-web,${ALLOWED_INTERNAL_HOSTS:-}
    depends_on:
      backend:
        condition: service_healthy

  agent-worker-bg:
    # 06a background runs (arq, queue llm-background): exams and batch work; they take the model
    # slot only after interactive work and, on airgap CPU, inside BACKGROUND_WINDOW.
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    command: ["arq", "ffcore.runtime.worker.BackgroundWorker"]
    restart: unless-stopped
    environment: *agent-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${REGISTRY_PREFIX}ffcore/frontend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    build:
      context: ./frontend
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
        # Same-origin API (C6): Next.js rewrites /api/v1/* here; rewrites are fixed at build time.
        FFCORE_BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      # Server components read the session (GET /auth/me) from the backend directly.
      FFCORE_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  migrate:
    # One-shot schema step before the backend (K-03b-0005): its own exit code and log, idempotent
    # on every `up`. Roll back: docker compose run --rm migrate alembic downgrade <revision to keep>
    # (an explicit revision: since the merge 57_0002 the graph has one head and `<label>@-1` is
    # refused as an ambiguous walk; docs/gelistirme-ortami.md).
    # Then the static model catalog is loaded from deploy/seed (03a, idempotent).
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    command:
      - sh
      - -c
      # 06a: the LangGraph checkpointer's tables, inside the schema Alembic 06a created (S12).
      - >-
        alembic upgrade heads
        && python -m ffcore.cli load-model-catalog --path /app/seed/model_catalog.yaml
        && python -m ffcore.cli setup-checkpointer
    restart: "no"
    volumes:
      - ./deploy/seed:/app/seed:ro
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy

  fake-llm:
    # Test only (package 01): fake OpenAI-compatible provider LiteLLM calls in integration tests.
    # Stdlib script from backend/tests/fakes; never part of an installation.
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    profiles: ["test"]
    command: ["python", "/fakes/fake_openai.py"]
    volumes:
      - ./backend/tests/fakes:/fakes:ro
    restart: "no"

  ticket-desk:
    # Test only (package 18): fake external ticket system for the F2/F11 scenarios, an MCP server
    # with list_tickets / get_ticket / send_reply (records only, no outbound request). Tickets
    # are the 13a/18 samples, read-only. Registered with auth none; never part of an installation.
    image: ${REGISTRY_PREFIX}ffcore/backend:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    profiles: ["test"]
    command: ["python", "/svc/ticket_desk_server.py"]
    volumes:
      - ./services/ticket-desk:/svc:ro
      - ./data/samples/tickets:/data/tickets:ro
      - ./data/samples/poison:/data/poison:ro
    restart: "no"
    healthcheck: *mcp-health

  tools:
    # Geliştirme araçları (make, ruff, pytest, curl). Host'a araç kurulmaz (K-00-0003, K-00-0005).
    # Çağrı: docker compose run --rm tools make <hedef>. Docker soketi bağlanmaz.
    image: ${REGISTRY_PREFIX}ffcore/tools:${FFCORE_VERSION:?FFCORE_VERSION tanımlı değil}
    build:
      context: ./backend
      target: tools
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - .:/work
      - model_cache:/models
    environment:
      <<: *app-env
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-}
      # make seed-models (01) only; read once on first install, never given to the backend.
      SEED_ANTHROPIC_API_KEY: ${SEED_ANTHROPIC_API_KEY:-}
      SEED_AZURE_OPENAI_API_KEY: ${SEED_AZURE_OPENAI_API_KEY:-}
      SEED_AZURE_OPENAI_API_BASE: ${SEED_AZURE_OPENAI_API_BASE:-}
      SEED_AZURE_OPENAI_API_VERSION: ${SEED_AZURE_OPENAI_API_VERSION:-}
      SEED_AZURE_OPENAI_DEPLOYMENT: ${SEED_AZURE_OPENAI_DEPLOYMENT:-}
      SEED_OLLAMA_BASE_URL: ${SEED_OLLAMA_BASE_URL:-}
      SEED_VLLM_BASE_URL: ${SEED_VLLM_BASE_URL:-}
      SEED_VLLM_MODEL: ${SEED_VLLM_MODEL:-}
      # 05a: `make seed-sql-demo` gives mcp-sql's login user this password (empty: loud error).
      AGENT_DEMO_DB_PASSWORD: ${AGENT_DEMO_DB_PASSWORD:-}

  e2e:
    # Console acceptance tests against this stack (10a-binding, K-10ab-0004). Builds and serves the
    # console itself on localhost:3000 (= CONSOLE_ORIGINS) and drives Chromium; host needs no Node.
    # Call: docker compose --profile e2e run --rm e2e   (docs/onyuz.md has the full sequence)
    # Image = @playwright/test version in frontend/package.json; digest pinned, 12 mirrors it.
    image: ${REGISTRY_PREFIX}mcr.microsoft.com/playwright@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
    profiles: ["e2e"]
    ipc: host
    working_dir: /work/frontend
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run test:e2e"]
    volumes:
      - .:/work
      # glibc node_modules, kept apart from the alpine (musl) ones of the frontend image.
      - e2e_node_modules:/work/frontend/node_modules
    environment:
      FFCORE_BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
      # 10a-forms (K-10af-0002 D2): tests read LiteLLM's /model/info to prove a model added in the
      # console reaches the gateway. Test value from .env.test, sent only as a header.
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is not set}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  e2e_node_modules:
  postgres_data:
  redis_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  # 04a: model weights shared by backend, worker and tools (same uid 10001 owns /models).
  model_cache:
  qdrant_data:
  knowledge_storage:
