# Ollama ek dosyası: yalnızca INFERENCE_BACKEND=ollama (airgap) kurulumunda eklenir (review 00-r1 MAJOR-2).
# .env: COMPOSE_FILE=compose.yaml:deploy/docker-compose.ollama.yml ve COMPOSE_PROFILES=ollama (K-00-0004).
# Ayrı dosya, çünkü compose ${VAR:?} interpolasyonunu profil elemesinden önce yapar: aynı dosyada
# kalsaydı llmaas da kullanmadığı OLLAMA_MEM_LIMIT/OLLAMA_CONTEXT_LENGTH olmadan durardı.
services:
  ollama:
    image: ${REGISTRY_PREFIX}ollama/ollama:0.12.6
    profiles: ["ollama"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:?OLLAMA_CONTEXT_LENGTH zorunlu (varsayılan 4096 prompt'u sessizce kırpar)}
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    volumes:
      - ${OLLAMA_MODELS_DIR:-ollama_models}:/root/.ollama
    mem_limit: ${OLLAMA_MEM_LIMIT:?OLLAMA_MEM_LIMIT tanımlı değil (docs/donanim.md bellek bütçesi)}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  ollama_models:
