# FFCore TLS reverse proxy (package 12, FOLLOWUP-66, C16). Certificates: TLS_CERT_DIR.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    client_max_body_size 520m;  # UPLOAD_MAX_REQUEST_BYTES (541065216) plus headers

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ffcore:10m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 600s;

    # Internal listener: console (Next.js serves /api/v1 same-origin) and the API surfaces.
    server {
        listen 8443 ssl;
        http2 on;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;

        # OpenAI-compatible facade and MCP second surface (streams: no buffering).
        location /v1/ {
            proxy_pass http://backend:8000;
            proxy_buffering off;
        }
        location /mcp/ {
            proxy_pass http://backend:8000;
            proxy_buffering off;
        }
        location / {
            proxy_pass http://frontend:3000;
            proxy_buffering off;
        }
    }

    # Public listener: the one path the outside may reach (Teams Bot Framework, package 15).
    server {
        listen 9443 ssl;
        http2 on;
        add_header Strict-Transport-Security "max-age=31536000" always;

        # A fixed URI: nginx sends this normalised path, never the client's raw request path
        # (/x/../channels/teams/messages matches here but must not reach the backend as is).
        location = /channels/teams/messages {
            proxy_pass http://backend:8000/channels/teams/messages;
        }
        location / {
            add_header X-FFCore-Edge public-denied always;
            return 404;
        }
    }
}
