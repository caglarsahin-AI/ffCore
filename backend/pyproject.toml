[project]
name = "ffcore"
version = "0.0.0"
description = "FFCore enterprise AI agent platform backend (import ffcore)"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "psycopg[binary]==3.3.6",
    "redis==5.3.1",
    "pyjwt==2.15.1",
    "greenlet==3.5.6",
    "httpx2==2.16.0",
    "argon2-cffi==25.1.0",
    "cryptography==50.0.2",
    "pyyaml==6.0.3",
    "python-multipart==0.0.32",
    "pgvector==0.5.1",
    # 04a knowledge (K-04a-0002 S1): PayCore's measured, locked versions.
    # torch/torchvision are direct so [tool.uv.sources] can pin them to the CPU index; otherwise
    # they arrive transitively from PyPI as the CUDA build.
    "torch==2.14.0",
    "torchvision==0.29.0",
    "transformers==4.57.6",
    "FlagEmbedding==1.4.2",
    "docling==2.125.0",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
    "paddleocr==2.10.0",
    "paddlepaddle==3.3.1",
    "extract-msg==0.56.1",
    "beautifulsoup4==4.15.0",
    # One queue library (C10); the ingest worker.
    "arq==0.28.0",
    "langfuse==4.15.1",
    # 05a (K-05a-0002 S1): MCP client and servers (streamable HTTP), SQL validation.
    "mcp==2.3.0",
    "sqlglot==30.23.0",
    # 06a: structured_output schemas are checked at save time (C8); already locked via
    # dependencies, now direct because ffcore imports it.
    "jsonschema==4.26.0",
    # 06a agent runtime (K-06a-0002 S1): graph, interrupt/resume and the Postgres checkpointer.
    # No PayCore reference pin exists; each release is at least two weeks old (2026-10-12).
    # langchain-core arrives with LangGraph; its LangSmith tracing must stay off (startup check).
    "langgraph==1.2.15",
    "langgraph-checkpoint==4.3.0",
    "langgraph-checkpoint-postgres==3.1.3",
    "langchain-core==1.6.10",
    "psycopg-pool==3.3.3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

# Two-week rule for the packages 06a adds and everything they pull in (K-06a-0002 S1): nothing
# published after this date enters the lock through them.
[tool.uv.exclude-newer-package]
distro = "2026-10-15T00:00:00Z"
jsonpatch = "2026-10-15T00:00:00Z"
jsonpointer = "2026-10-15T00:00:00Z"
langchain-core = "2026-10-15T00:00:00Z"
langchain-protocol = "2026-10-15T00:00:00Z"
langgraph = "2026-10-15T00:00:00Z"
langgraph-checkpoint = "2026-10-15T00:00:00Z"
langgraph-checkpoint-postgres = "2026-10-15T00:00:00Z"
langgraph-prebuilt = "2026-10-15T00:00:00Z"
langgraph-sdk = "2026-10-15T00:00:00Z"
langsmith = "2026-10-15T00:00:00Z"
orjson = "2026-10-15T00:00:00Z"
ormsgpack = "2026-10-15T00:00:00Z"
psycopg-pool = "2026-10-15T00:00:00Z"
requests-toolbelt = "2026-10-15T00:00:00Z"
sniffio = "2026-10-15T00:00:00Z"
tenacity = "2026-10-15T00:00:00Z"
uuid-utils = "2026-10-15T00:00:00Z"
zstandard = "2026-10-15T00:00:00Z"

# A second package index: an internal mirror must proxy download.pytorch.org too (12).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# 05a S1: sse-starlette (via mcp) pinned to 3.5.0; 3.5.1 and 3.6.0 were days old when 05a was planned.
constraint-dependencies = ["sse-starlette==3.5.0"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[build-system]
# uv'nun pinli sürümüyle aynı: uv yerleşik derleme arka ucunu kullanır, ağ gerekmez.
requires = ["uv_build==0.10.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ffcore"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "models: needs real model weights (RUN_MODEL_TESTS=1, make test-models)",
    "vectorstore: needs a Qdrant container (RUN_QDRANT_TESTS=1)",
    "dns: sends a real DNS lookup through the host resolver (RUN_DNS_TESTS=1)",
]
