  /api/v1/internal/guardrails/evaluate:
    post:
      tags:
      - guardrails
      - guardrails-internal
      summary: Evaluate a text at a stage (service account only)
      description: 'CONTRACTS C4. Writes one guardrail event per evaluated rule. A `block` decision is
        a

        200 response with `action=block`; the caller fails the run (06a) or returns 400 (06b). A

        token scope whose placeholder numbers are used up (it would issue past 9999999) is 400

        `placeholder_out_of_range`, whatever the policy''s `on_error` says (08-tam-1a r4/r5).'
      operationId: evaluate_guardrails_api_v1_internal_guardrails_evaluate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionOut'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    BlockMessage:
      properties:
        en:
          type: string
          minLength: 1
          title: En
          default: This request was blocked by a guardrail policy.
        tr:
          anyOf:
          - type: string
          - type: 'null'
          title: Tr
      additionalProperties: false
      type: object
      title: BlockMessage
    CustomPattern:
      properties:
        name:
          type: string
          maxLength: 64
          minLength: 1
          title: Name
        category:
          type: string
          title: Category
        pattern:
          type: string
          maxLength: 200
          minLength: 1
          title: Pattern
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
          default: 0.8
      additionalProperties: false
      type: object
      required:
      - name
      - category
      - pattern
      title: CustomPattern
    DecisionOut:
      properties:
        action:
          type: string
          enum:
          - allow
          - block
          - redact
          - mask
          - tokenize
          - warn
          - log
          title: Action
        text_out:
          type: string
          title: Text Out
        message:
          anyOf:
          - type: string
          - type: 'null'
          title: Message
        reference_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Id
        policy_key:
          type: string
          title: Policy Key
        builtin:
          type: boolean
          title: Builtin
        events:
          items:
            $ref: '#/components/schemas/EventOut'
          type: array
          title: Events
      type: object
      required:
      - action
      - text_out
      - message
      - reference_id
      - policy_key
      - builtin
      - events
      title: DecisionOut
      description: CONTRACTS C4 decision as returned to internal callers (06a, 06b).
    ErrorBody:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorBody
      description: OpenAI-shaped error body used by every 4xx response.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: English, actionable, never contains secrets.
        type:
          type: string
          title: Type
          description: authentication_error, permission_error, not_found_error, ...
        code:
          type: string
          title: Code
          description: Stable machine-readable code, e.g. read_only_access.
      type: object
      required:
      - message
      - type
      - code
      title: ErrorDetail
    EvaluateRequest:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        stage:
          type: string
          enum:
          - prompt.pre
          - input.pre
          - output.pre
          - output.stream.delta
          - tool.pre
          - tool.post
          - egress
          title: Stage
        text:
          type: string
          title: Text
        policy_key:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,63}$
          title: Policy Key
          description: Unique within the project, immutable.
          default: default
        run_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Run Id
          description: Required for tokenize.
        source:
          type: string
          enum:
          - agent-playground
          - chat
          - api
          - channel
          title: Source
          default: api
        tool:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool
        locale:
          type: string
          enum:
          - tr
          - en
          title: Locale
          default: en
