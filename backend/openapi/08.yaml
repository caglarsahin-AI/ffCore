  /api/v1/internal/guardrails/ner:
    post:
      tags:
      - guardrails
      - guardrails-internal
      summary: Find person, organization and location names (service account only)
      description: '08 tam 1b: the API process holds the NER model; the agent and ingest workers ask here

        (the /internal/embed pattern). Spans only, never values. Without NER_MODEL / NER_REVISION

        503 `ner_not_configured`; a missing weight 503 `model_missing` (run `make models`).'
      operationId: internal_ner_api_v1_internal_guardrails_ner_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NerRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
