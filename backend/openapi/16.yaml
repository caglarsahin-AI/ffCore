  /api/v1/projects/{project_id}/data-sources/{source_id}/items:
    get:
      tags:
      - data-sources
      summary: List source items
      operationId: list_items_api_v1_projects__project_id__data_sources__source_id__items_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(active|deleted)$
          - type: 'null'
          title: State
      - name: errors
        in: query
        required: false
        schema:
          type: boolean
          description: Only items whose last run failed them.
          default: false
          title: Errors
        description: Only items whose last run failed them.
      - name: skipped
        in: query
        required: false
        schema:
          type: boolean
          description: Only items Kapı 0 skipped.
          default: false
          title: Skipped
        description: Only items Kapı 0 skipped.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
