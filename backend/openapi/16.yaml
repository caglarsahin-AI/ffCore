      operationId: list_mappings_api_v1_projects__project_id__data_sources__source_id__acl_mappings_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
