          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    AclMappingIn:
      properties:
        external_group:
          type: string
          maxLength: 500
          minLength: 1
          title: External Group
          description: 'A source group (fs: folder:/path; ''*'' maps every item).'
        role:
          anyOf:
          - type: string
            pattern: ^(user|analyst|developer|admin)$
          - type: 'null'
          title: Role
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
      additionalProperties: false
      type: object
      required:
      - external_group
      title: AclMappingIn
    AclMappingList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AclMappingOut'
          type: array
          title: Data
      type: object
      required:
      - data
      title: AclMappingList
    AclMappingOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        external_group:
          type: string
          title: External Group
        role:
          anyOf:
          - type: string
          - type: 'null'
          title: Role
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
        created_by:
          type: string
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - external_group
      - role
      - user_id
      - created_by
      - created_at
      title: AclMappingOut
    AclMappingsPut:
