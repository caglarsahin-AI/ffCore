    put:
      tags:
      - data-sources
      summary: Replace ACL mappings
      description: 'Replaces the whole list. Each row maps one group to one role or one project member;

        an unmapped group stays admin-only. Takes effect on the next raw run (C15).'
      operationId: put_mappings_api_v1_projects__project_id__data_sources__source_id__acl_mappings_put
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Source Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AclMappingsPut'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AclMappingList'
        '400':
          description: Invalid request.
