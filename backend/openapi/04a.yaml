components:
  schemas:
    Body_upload_documents_api_v1_projects__project_id__knowledge_bases__kb_id__documents_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
          description: One or more files.
        acl_roles:
          anyOf:
          - items:
              $ref: '#/components/schemas/Role'
            type: array
          - type: 'null'
          title: Acl Roles
          description: 'Roles that may read the files. Omitted: analyst (shown in the response). Send
            none of acl_roles and acl_users only on purpose: an empty ACL opens the document to every
            project member (C15).'
        acl_users:
          anyOf:
          - items:
              type: string
              format: uuid
            type: array
          - type: 'null'
          title: Acl Users
          description: Users that may read.
      type: object
      required:
      - files
      title: Body_upload_documents_api_v1_projects__project_id__knowledge_bases__kb_id__documents_post
    CheckStatus:
      type: string
      enum:
      - ok
      - failed
      - skipped
      title: CheckStatus
    DocumentList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/DocumentOut'
          type: array
          title: Data
      type: object
      required:
      - data
      title: DocumentList
    DocumentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kb_id:
          type: string
          format: uuid
          title: Kb Id
        filename:
          type: string
          title: Filename
        mime_sniffed:
          anyOf:
          - type: string
          - type: 'null'
          title: Mime Sniffed
        size:
          type: integer
          title: Size
        sha256:
          type: string
          title: Sha256
        status:
          $ref: '#/components/schemas/DocumentStatus'
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
          description: Error code and message when failed or timeout.
        page_count:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page Count
        acl_roles:
          items:
            $ref: '#/components/schemas/Role'
          type: array
          title: Acl Roles
          description: 'Roles that may read the document. Both lists empty: every project member.'
        acl_users:
          items:
            type: string
            format: uuid
          type: array
          title: Acl Users
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        version:
          type: integer
          title: Version
        breadcrumb:
          anyOf:
          - type: string
          - type: 'null'
          title: Breadcrumb
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        duplicate_of:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Duplicate Of
        gate0:
          $ref: '#/components/schemas/GateDecision'
        gate1:
          $ref: '#/components/schemas/GateDecision'
        gate2:
          $ref: '#/components/schemas/GateDecision'
        convert_engine:
          anyOf:
          - type: string
          - type: 'null'
          title: Convert Engine
        convert_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Convert Seconds
        chunk_count:
          type: integer
          title: Chunk Count
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - kb_id
      - filename
      - mime_sniffed
      - size
      - sha256
      - status
      - error
      - page_count
      - acl_roles
      - acl_users
      - metadata
      - version
      - breadcrumb
      - language
      - duplicate_of
      - gate0
      - gate1
      - gate2
      - convert_engine
      - convert_seconds
      - chunk_count
      - created_at
      - updated_at
      title: DocumentOut
    DocumentStatus:
      type: string
      enum:
      - pending
      - converting
      - gated
      - chunking
      - embedding
      - indexed
      - skipped
      - failed
      - timeout
      title: DocumentStatus
      description: Derived from the gate decisions; `skipped` always carries a gate reason (fail-loud).
    EmbedRequest:
      properties:
        texts:
          items:
            type: string
          type: array
          maxItems: 64
          minItems: 1
          title: Texts
      additionalProperties: false
      type: object
      required:
      - texts
      title: EmbedRequest
    EmbedResponse:
      properties:
        model:
          type: string
          title: Model
        dim:
          type: integer
          title: Dim
        dense:
          items:
            items:
              type: number
            type: array
          type: array
          title: Dense
        sparse:
          items:
            additionalProperties:
              type: number
            type: object
          type: array
          title: Sparse
          description: Token id → lexical weight per text.
        truncated:
          items:
            type: boolean
          type: array
          title: Truncated
          description: True where the text exceeded the model limit.
      type: object
      required:
      - model
      - dim
      - dense
      - sparse
      - truncated
      title: EmbedResponse
    ErrorBody:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorBody
      description: OpenAI-shaped error body used by every 4xx response.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: English, actionable, never contains secrets.
        type:
          type: string
          title: Type
          description: authentication_error, permission_error, not_found_error, ...
        code:
          type: string
          title: Code
          description: Stable machine-readable code, e.g. read_only_access.
      type: object
      required:
      - message
      - type
      - code
      title: ErrorDetail
    GateDecision:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/GateStatus'
          - type: 'null'
          description: Null until the gate has run.
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: e.g. boilerplate, data_dump:log, duplicate_of:<id>.
      type: object
      required:
      - status
      - reason
      title: GateDecision
    GateStatus:
      type: string
      enum:
      - ok
      - flagged
      - skipped
      title: GateStatus
    KnowledgeBaseCreate:
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,63}$
          title: Key
          description: Knowledge base key, unique within the project.
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        embed_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Embed Model
          description: Must equal the installation's EMBED_MODEL if given (one model per installation);
            a different value is refused with 400 embed_dim_mismatch or embed_model_mismatch.
        embed_dim:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Embed Dim
          description: Must equal EMBED_DIM if given.
        chunk_size:
          type: integer
          maximum: 4000.0
          minimum: 50.0
          title: Chunk Size
          description: 'Lower token target of a chunk (measured: 400).'
          default: 400
        chunk_overlap:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Chunk Overlap
          description: Overlap in tokens.
          default: 0
        hybrid:
          type: boolean
          title: Hybrid
          description: Vector plus lexical leg, fused with RRF.
          default: true
        rerank:
          type: boolean
          title: Rerank
          description: Rerank candidates; see threshold_mode.
          default: true
        default_top_k:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Default Top K
          default: 5
        default_min_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Default Min Score
          description: Embedding score floor; applies only while rerank is false (K2).
        default_filter:
          additionalProperties: true
          type: object
          title: Default Filter
      additionalProperties: false
      type: object
      required:
      - key
      - name
      title: KnowledgeBaseCreate
    KnowledgeBaseList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/KnowledgeBaseOut'
          type: array
          title: Data
      type: object
      required:
      - data
      title: KnowledgeBaseList
    KnowledgeBaseOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        key:
          type: string
          title: Key
        name:
          type: string
          title: Name
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        embed_model:
          type: string
          title: Embed Model
        embed_dim:
          type: integer
          title: Embed Dim
        chunk_strategy:
          type: string
          const: heading
          title: Chunk Strategy
        chunk_size:
          type: integer
          title: Chunk Size
        chunk_overlap:
          type: integer
          title: Chunk Overlap
        chunk_max_tokens:
          type: integer
          title: Chunk Max Tokens
          description: Derived upper bound of a chunk in tokens.
        hybrid:
          type: boolean
          title: Hybrid
        rerank:
          type: boolean
          title: Rerank
        rerank_model:
          type: string
          title: Rerank Model
        default_top_k:
          type: integer
          title: Default Top K
        default_min_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Default Min Score
        default_filter:
          additionalProperties: true
          type: object
          title: Default Filter
        normalizer_config_id:
          type: string
          title: Normalizer Config Id
        status:
          $ref: '#/components/schemas/KnowledgeBaseStatus'
        document_count:
          type: integer
          title: Document Count
        chunk_count:
          type: integer
          title: Chunk Count
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - project_id
      - key
      - name
      - description
      - embed_model
      - embed_dim
      - chunk_strategy
      - chunk_size
      - chunk_overlap
      - chunk_max_tokens
      - hybrid
      - rerank
      - rerank_model
      - default_top_k
      - default_min_score
      - default_filter
      - normalizer_config_id
      - status
      - document_count
      - chunk_count
      - created_at
      - updated_at
      title: KnowledgeBaseOut
    KnowledgeBaseStatus:
      type: string
      enum:
      - active
      - reindexing
      title: KnowledgeBaseStatus
    KnowledgeBaseUpdate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Description
        chunk_size:
          type: integer
          maximum: 4000.0
          minimum: 50.0
          title: Chunk Size
          description: Takes effect with a gold reindex.
        chunk_overlap:
          type: integer
          maximum: 1000.0
          minimum: 0.0
          title: Chunk Overlap
          description: Takes effect with a gold reindex.
        hybrid:
          type: boolean
          title: Hybrid
        rerank:
          type: boolean
          title: Rerank
        default_top_k:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Default Top K
        default_min_score:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Default Min Score
