          additionalProperties: true
          type: object
          title: Default Filter
      additionalProperties: false
      type: object
      title: KnowledgeBaseUpdate
    ReadinessCheck:
      properties:
        name:
          type: string
          title: Name
        status:
          $ref: '#/components/schemas/CheckStatus'
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
