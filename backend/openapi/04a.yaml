    ReindexAccepted:
      properties:
        job_id:
          type: string
          title: Job Id
        layer:
          $ref: '#/components/schemas/ReindexLayer'
        full:
          type: boolean
          title: Full
        documents:
          type: integer
          title: Documents
      type: object
      required:
      - job_id
      - layer
      - full
      - documents
      title: ReindexAccepted
    ReindexLayer:
      type: string
      enum:
      - silver
      - gold
      title: ReindexLayer
    ReindexRequest:
      properties:
        layer:
          $ref: '#/components/schemas/ReindexLayer'
          description: 'silver: reconvert from raw; gold: rechunk and re-embed from silver. Neither goes
            back to the source system.'
        full:
          type: boolean
          title: Full
          description: Every document, not only changed ones.
          default: false
      additionalProperties: false
      type: object
      required:
      - layer
      title: ReindexRequest
    Role:
      type: string
      enum:
      - user
      - analyst
      - developer
      - admin
      title: Role
      description: 'Fixed roles, ordered user < analyst < developer < admin. `developer` and `user` are

        reserved in the PoC and cannot be assigned yet.'
    SearchFilters:
      properties:
        document_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Document Ids
        metadata:
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: boolean
          type: object
          title: Metadata
          description: Equality filters on document metadata.
      additionalProperties: false
      type: object
      title: SearchFilters
    SearchHit:
      properties:
        chunk_id:
          type: string
          format: uuid
          title: Chunk Id
        document_id:
          type: string
          format: uuid
          title: Document Id
        document_name:
          type: string
          title: Document Name
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
        section_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Section Path
        breadcrumb:
          type: string
          title: Breadcrumb
        text:
          type: string
          title: Text
          description: Chunk text as embedded, starting with the breadcrumb.
        chunk_status:
          type: string
          enum:
          - ok
          - flagged
          title: Chunk Status
        updated_at_source:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At Source
        age_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Age Days
        embed_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Embed Score
        rerank_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Rerank Score
      type: object
      required:
      - chunk_id
      - document_id
      - document_name
      - page
      - section_path
      - breadcrumb
      - text
      - chunk_status
      - updated_at_source
      - age_days
      - embed_score
      - rerank_score
      title: SearchHit
    SearchRequest:
      properties:
        query:
          type: string
          maxLength: 2000
          minLength: 1
          title: Query
        top_k:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Top K
          description: 'Default: the KB''s.'
        filters:
          $ref: '#/components/schemas/SearchFilters'
        hybrid:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Hybrid
          description: 'Default: the KB''s.'
      additionalProperties: false
      type: object
      required:
      - query
      title: SearchRequest
    SearchResponse:
      properties:
        query_id:
          type: string
          format: uuid
          title: Query Id
          description: Row in kb_queries; candidates are logged there.
        hits:
          items:
            $ref: '#/components/schemas/SearchHit'
          type: array
          title: Hits
        threshold_mode:
          $ref: '#/components/schemas/ThresholdMode'
        filtered_by_rerank_floor:
          type: integer
          title: Filtered By Rerank Floor
        filtered_by_min_score:
          type: integer
          title: Filtered By Min Score
        normalizer_config_id:
          type: string
          title: Normalizer Config Id
        latency_ms:
          type: integer
          title: Latency Ms
      type: object
      required:
      - query_id
      - hits
      - threshold_mode
      - filtered_by_rerank_floor
      - filtered_by_min_score
      - normalizer_config_id
      - latency_ms
      title: SearchResponse
      description: Hits are ordered newest source first (recency is shown, not scored).
    ThresholdMode:
      type: string
      enum:
      - rerank_floor
      - min_score
      title: ThresholdMode
      description: 'Single threshold rule (K2): with the reranker on only the rerank floor applies; with
        it

        off only `min_score` (embedding score) applies. Never both.'
    UploadOutcome:
      type: string
      enum:
      - created
      - new_version
      - unchanged
      title: UploadOutcome
    UploadResult:
      properties:
        data:
          items:
            $ref: '#/components/schemas/UploadedDocument'
          type: array
          title: Data
      type: object
      required:
      - data
      title: UploadResult
    UploadedDocument:
      properties:
        outcome:
          $ref: '#/components/schemas/UploadOutcome'
          description: 'unchanged: same sha256 as the current version, nothing is queued.'
        document:
          $ref: '#/components/schemas/DocumentOut'
      type: object
      required:
      - outcome
      - document
      title: UploadedDocument
