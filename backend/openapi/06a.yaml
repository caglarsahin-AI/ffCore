  /api/v1/projects/{project_id}/agents/{agent_key}/runs:
    post:
      tags:
      - runs
      summary: Create Run
      description: 'Queue a run of the published version (or, with channel=test, a given version) and

        stream its events. The run id is the first event (`progress` with `run_id`).'
      operationId: create_run_api_v1_projects__project_id__agents__agent_key__runs_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: agent_key
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          description: Agent key, unique within the project (C1).
          title: Agent Key
        description: Agent key, unique within the project (C1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '200':
          description: 'Server-sent events. Event names (C9): token, tool_call, tool_result, approval_required,
            question, sources, progress, fallback, done, error; unknown names are to be ignored. Each
            event has an `id` (resume with Last-Event-ID). A comment line is sent every SSE_KEEPALIVE_S.
            The stream ends after done, error, approval_required or question.'
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            text/event-stream:
              schema:
