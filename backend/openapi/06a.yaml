components:
  schemas:
    AgentCreate:
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          title: Key
          description: Agent key, unique within the project (C1).
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
        model:
          type: string
          title: Model
          description: Project model key, e.g. chat-default.
      additionalProperties: false
      type: object
      required:
      - key
      - name
      - model
      title: AgentCreate
      description: 'First step of the two-step creation: name, description and model. The first draft

        version gets a minimal definition; the rest is filled with PUT .../versions/{version}.'
    AgentDefinition:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
          default: 1
        model:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,63}$
          title: Model
          description: Project model key.
        system_prompt:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: System Prompt
        langfuse_prompt:
          anyOf:
          - $ref: '#/components/schemas/LangfusePromptRef'
          - type: 'null'
        variables:
          items:
            $ref: '#/components/schemas/Variable'
          type: array
          title: Variables
        knowledge:
          items:
            $ref: '#/components/schemas/KnowledgeRef'
          type: array
          title: Knowledge
        tools:
          items:
            $ref: '#/components/schemas/ToolRef'
          type: array
          title: Tools
        approval:
          anyOf:
          - $ref: '#/components/schemas/Approval'
          - type: 'null'
        ask_user:
          type: boolean
          title: Ask User
          default: false
        guardrail_policy_key:
          type: string
          maxLength: 64
          minLength: 1
          title: Guardrail Policy Key
          default: default
        structured_output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Structured Output
        limits:
          $ref: '#/components/schemas/Limits'
        context_policy:
          $ref: '#/components/schemas/ContextPolicy'
        answer_rules:
          $ref: '#/components/schemas/AnswerRules'
        reasoning:
          type: string
          enum:
          - none
          - model_default
          title: Reasoning
          default: none
        runtime_profile:
          type: string
          const: default
          title: Runtime Profile
          default: default
      additionalProperties: false
      type: object
      required:
      - model
      title: AgentDefinition
    AgentKind:
      type: string
      enum:
      - native
      - external
      title: AgentKind
    AgentList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: AgentList
    AgentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          title: Key
          description: Agent key, unique within the project (C1).
        name:
          type: string
          title: Name
        description:
          type: string
          title: Description
        status:
          $ref: '#/components/schemas/AgentStatus'
        kind:
          $ref: '#/components/schemas/AgentKind'
        current_version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Current Version Id
          description: The published version, if any.
        latest_version:
          type: integer
          title: Latest Version
          description: Highest version number (draft or published).
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - project_id
      - key
      - name
      - description
      - status
      - kind
      - current_version_id
      - latest_version
      - created_at
      - updated_at
      title: AgentOut
    AgentStatus:
      type: string
      enum:
      - draft
      - published
      - inactive
      title: AgentStatus
    AgentUpdate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
      additionalProperties: false
      type: object
      title: AgentUpdate
    AnswerRules:
      properties:
        cite_sources:
          type: boolean
          title: Cite Sources
          default: true
        unknown_reply:
          type: string
          minLength: 1
          title: Unknown Reply
          default: This information is not in the documents.
        confidence_formula:
          type: string
          enum:
          - cited
          - max
          - sentence_max
          title: Confidence Formula
          default: cited
        confidence_threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence Threshold
        show_confidence:
          type: boolean
          title: Show Confidence
          default: false
        verify:
          type: boolean
          title: Verify
          default: false
        max_answer_tokens:
          type: integer
          minimum: 16.0
          title: Max Answer Tokens
          default: 400
      additionalProperties: false
      type: object
      title: AnswerRules
    Approval:
      properties:
        actions:
          items:
            type: string
          type: array
          title: Actions
          description: '''<tool_key>.<action>''; joined with needs_approval.'
        assign_to:
          type: string
          enum:
          - analyst
          - developer
          - admin
          title: Assign To
          default: admin
      additionalProperties: false
      type: object
      title: Approval
    Channel:
      type: string
      enum:
      - chat
      - api
      - test
      - slack
      - teams
      - mattermost
      - widget
      title: Channel
    ContextPolicy:
      properties:
        history_turns:
          type: integer
          minimum: 0.0
          title: History Turns
          default: 6
        history_summarize:
          type: boolean
          title: History Summarize
          default: true
        history_max_tokens:
          type: integer
          minimum: 0.0
          title: History Max Tokens
          default: 3000
        memory_max_tokens:
          type: integer
          minimum: 0.0
          title: Memory Max Tokens
          default: 300
        rag_max_tokens:
          type: integer
          minimum: 0.0
          title: Rag Max Tokens
          default: 4000
        tools_schema_max_tokens:
          type: integer
          minimum: 0.0
          title: Tools Schema Max Tokens
          default: 1500
        output_reserve_tokens:
          type: integer
          minimum: 0.0
          title: Output Reserve Tokens
          default: 800
        trim_order:
          items:
            type: string
            enum:
            - history
            - rag
            - memory
          type: array
          maxItems: 3
          minItems: 3
          title: Trim Order
      additionalProperties: false
      type: object
      title: ContextPolicy
    ErrorBody:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorBody
      description: OpenAI-shaped error body used by every 4xx response.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: English, actionable, never contains secrets.
        type:
          type: string
          title: Type
          description: authentication_error, permission_error, not_found_error, ...
        code:
          type: string
          title: Code
          description: Stable machine-readable code, e.g. read_only_access.
      type: object
      required:
      - message
      - type
      - code
      title: ErrorDetail
    KnowledgeFilter:
      properties:
        scope:
          items:
            type: string
          type: array
          maxItems: 50
          title: Scope
      additionalProperties: false
      type: object
      title: KnowledgeFilter
    KnowledgeRef:
      properties:
        kb_key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          title: Kb Key
        mode:
          type: string
          enum:
          - always
          - tool
          title: Mode
        top_k:
          anyOf:
          - type: integer
            maximum: 50.0
            minimum: 1.0
          - type: 'null'
          title: Top K
          description: 'None: the KB default.'
        min_score:
          anyOf:
          - type: number
          - type: 'null'
          title: Min Score
          description: Only with the reranker off (one threshold rule, K2).
        filter:
          anyOf:
          - $ref: '#/components/schemas/KnowledgeFilter'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - kb_key
      - mode
      title: KnowledgeRef
    LangfusePromptRef:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        label:
          type: string
          maxLength: 64
          minLength: 1
          title: Label
          default: production
      additionalProperties: false
      type: object
      required:
      - name
      title: LangfusePromptRef
      description: A managed prompt in Langfuse (02) used instead of an inline system prompt.
    Limits:
      properties:
        max_tool_calls:
          type: integer
          maximum: 50.0
          minimum: 0.0
          title: Max Tool Calls
          default: 6
        max_turns:
          type: integer
          maximum: 50.0
          minimum: 1.0
          title: Max Turns
          default: 10
        run_timeout_s:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Run Timeout S
          description: 'None: the installation''s RUN_TIMEOUT_S.'
        context_tokens:
          type: integer
          minimum: 1000.0
          title: Context Tokens
          default: 16000
        output_tokens:
          type: integer
          minimum: 16.0
          title: Output Tokens
          default: 800
      additionalProperties: false
      type: object
      title: Limits
    OutcomeLabel:
