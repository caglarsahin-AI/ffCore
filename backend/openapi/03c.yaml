  /api/v1/projects/{project_id}/usage:
    get:
      tags:
      - usage
      summary: Usage of the project over a date range
      operationId: get_usage_api_v1_projects__project_id__usage_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: First UTC day; default 30 days ago.
          title: Date From
        description: First UTC day; default 30 days ago.
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: Last UTC day; default today.
          title: Date To
        description: Last UTC day; default today.
      responses:
