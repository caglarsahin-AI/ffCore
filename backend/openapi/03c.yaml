components:
  schemas:
    ApiKeyAclRole:
      type: string
      enum:
      - analyst
      - developer
      - admin
      title: ApiKeyAclRole
      description: The role the key's own knowledge searches run under; at most the creator's role.
    ApiKeyCreate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scopes:
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
          minItems: 1
          title: Scopes
        acl_role:
          $ref: '#/components/schemas/ApiKeyAclRole'
          default: analyst
        allowed_cidrs:
          items:
            anyOf:
            - type: string
              format: ipv4network
            - type: string
              format: ipv6network
          type: array
          title: Allowed Cidrs
          description: 'Client networks allowed to use the key; empty: any.'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - name
      - scopes
      title: ApiKeyCreate
    ApiKeyCreated:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        key_prefix:
          type: string
          title: Key Prefix
          description: Public part of the key, shown in lists and audit.
        scopes:
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
          title: Scopes
        acl_role:
          $ref: '#/components/schemas/ApiKeyAclRole'
        allowed_cidrs:
          items:
            type: string
          type: array
          title: Allowed Cidrs
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: Updated at most once a minute.
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_by:
          type: string
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
        key:
          type: string
          title: Key
          description: The raw key. Returned only here, once; it is never stored.
      type: object
      required:
      - id
      - project_id
      - name
      - key_prefix
      - scopes
      - acl_role
      - allowed_cidrs
      - expires_at
      - last_used_at
      - revoked_at
      - created_by
      - created_at
      - key
      title: ApiKeyCreated
    ApiKeyList:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ApiKeyOut'
          type: array
          title: Data
      type: object
      required:
      - data
      title: ApiKeyList
    ApiKeyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        project_id:
          type: string
          format: uuid
          title: Project Id
        name:
          type: string
          title: Name
        key_prefix:
          type: string
          title: Key Prefix
          description: Public part of the key, shown in lists and audit.
        scopes:
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
          title: Scopes
        acl_role:
          $ref: '#/components/schemas/ApiKeyAclRole'
        allowed_cidrs:
          items:
            type: string
          type: array
          title: Allowed Cidrs
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
        last_used_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Used At
          description: Updated at most once a minute.
        revoked_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Revoked At
        created_by:
          type: string
          title: Created By
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - project_id
      - name
      - key_prefix
      - scopes
      - acl_role
      - allowed_cidrs
      - expires_at
      - last_used_at
      - revoked_at
      - created_by
      - created_at
      title: ApiKeyOut
    ApiKeyScope:
      type: string
      enum:
      - chat_direct
      - agents
      - impersonate
      - kb_search
      - tools_invoke
      title: ApiKeyScope
      description: 'C2. `impersonate`: the key may send X-On-Behalf-Of (a user''s signed token); only
        a project

        admin grants it.'
    ApiKeyUpdate:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        scopes:
          items:
            $ref: '#/components/schemas/ApiKeyScope'
          type: array
          minItems: 1
          title: Scopes
        acl_role:
          $ref: '#/components/schemas/ApiKeyAclRole'
        allowed_cidrs:
          items:
            anyOf:
            - type: string
              format: ipv4network
            - type: string
              format: ipv6network
          type: array
          title: Allowed Cidrs
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
      additionalProperties: false
      type: object
      title: ApiKeyUpdate
    ErrorBody:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorBody
      description: OpenAI-shaped error body used by every 4xx response.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: English, actionable, never contains secrets.
        type:
          type: string
          title: Type
          description: authentication_error, permission_error, not_found_error, ...
        code:
          type: string
          title: Code
          description: Stable machine-readable code, e.g. read_only_access.
      type: object
      required:
      - message
      - type
      - code
      title: ErrorDetail
    QuotaAction:
      type: string
      enum:
      - block
      - warn
      title: QuotaAction
      description: 'block: the call is refused (quota_exceeded); warn: the call goes on and is reported.'
    QuotaBudget-Input:
      properties:
        daily_usd:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Daily Usd
          description: USD per UTC day.
        monthly_usd:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Monthly Usd
          description: USD per month.
      additionalProperties: false
      type: object
      title: QuotaBudget
    QuotaBudget-Output:
      properties:
        daily_usd:
          anyOf:
