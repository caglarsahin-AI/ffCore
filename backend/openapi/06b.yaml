openapi: 3.1.0
info:
  title: FFCore API
  description: OpenAI-compatible facade (/v1, contract C11), agent manifest export and import, external
    agents (06b-2), and the internal search of runs started by an API key (package 06b).
  version: 0.6b
paths:
  /api/v1/projects/{project_id}/agents/{agent_id}/manifest:
    get:
      tags:
      - agent-manifest
      summary: Export Manifest
      description: 'The agent and one version''s definition (default: the published one, else the latest).

        Secrets are not in it: an external agent''s endpoint and key stay in this installation.'
      operationId: export_manifest_api_v1_projects__project_id__agents__agent_id__manifest_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: version
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Version
      - name: format
        in: query
        required: false
        schema:
          enum:
          - json
          - yaml
          type: string
          default: json
          title: Format
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Manifest'
            application/yaml: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/projects/{project_id}/agents/import:
    post:
      tags:
      - agent-manifest
      summary: Import Manifest
      description: 'A manifest becomes a new agent (draft version 1) or, when the key exists, its next

        draft version; nothing is published. `dry_run=true` validates and writes nothing. An older

        `schema_version` is read as such (C8).'
      operationId: import_manifest_api_v1_projects__project_id__agents_import_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: dry_run
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Dry Run
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Manifest'
          application/yaml:
            schema:
              $ref: '#/components/schemas/Manifest'
  /api/v1/projects/{project_id}/agents/external:
    post:
      tags:
      - agent-external
      summary: Create External Agent
      description: 'Register an external agent (a draft). Its base URL must pass the egress policy now
        and

        again when it is published and at every call.'
      operationId: create_external_agent_api_v1_projects__project_id__agents_external_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAgentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAgentOut'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/projects/{project_id}/agents/{agent_id}/external:
    get:
      tags:
      - agent-external
      summary: Get External Agent
      description: The agent and its endpoint; the key is never returned.
      operationId: get_external_agent_api_v1_projects__project_id__agents__agent_id__external_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAgentOut'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    put:
      tags:
      - agent-external
      summary: Update External Agent
      description: 'Change the base URL, remote model or key (omitted fields stay); the kind never changes.

        The resulting base URL is checked again.'
      operationId: update_external_agent_api_v1_projects__project_id__agents__agent_id__external_put
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalAgentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAgentOut'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/projects/{project_id}/agents/{agent_id}/external/publish:
    post:
      tags:
      - agent-external
      summary: Publish External Agent
      description: 'Publish an external agent (it has no versions): its configuration must exist and its

        base URL passes the egress policy again (K-06b2-0002 S3a).'
      operationId: publish_external_agent_api_v1_projects__project_id__agents__agent_id__external_publish_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAgentOut'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/chat/completions:
    post:
      tags:
      - facade
      summary: Chat Completions
      description: 'OpenAI chat completions; `stream: true` answers with OpenAI chunks over SSE.'
      operationId: chat_completions_v1_chat_completions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /v1/models:
    get:
      tags:
      - facade
      summary: List Models
      description: 'The key''s own project: its active models (scope `chat_direct`) and its published
        agents

        (scope `agents`). Nothing from another project.'
      operationId: list_models_v1_models_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelList'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /internal/knowledge-bases/{kb_id}/key-search:
    post:
      tags:
      - facade-internal
      summary: Internal Key Search
      description: 'The worker''s search for a run started by an API key without a user (06b, B7): ACL
        is

        the key''s `acl_role` and every role below it, read here from the key row. The key is checked

        again (revoked, expired, its project, the run''s own key), not trusted from the caller.'
      operationId: internal_key_search_internal_knowledge_bases__kb_id__key_search_post
      parameters:
      - name: kb_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Kb Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeySearchRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    AgentDefinition:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
          default: 1
        model:
          type: string
          pattern: ^[a-z][a-z0-9-]{1,63}$
          title: Model
          description: Project model key.
        system_prompt:
          anyOf:
          - type: string
            maxLength: 20000
          - type: 'null'
          title: System Prompt
        langfuse_prompt:
          anyOf:
          - $ref: '#/components/schemas/LangfusePromptRef'
          - type: 'null'
        variables:
          items:
            $ref: '#/components/schemas/Variable'
          type: array
          title: Variables
        knowledge:
          items:
            $ref: '#/components/schemas/KnowledgeRef'
          type: array
          title: Knowledge
        tools:
          items:
            $ref: '#/components/schemas/ToolRef'
          type: array
          title: Tools
        approval:
          anyOf:
          - $ref: '#/components/schemas/Approval'
          - type: 'null'
        ask_user:
          type: boolean
          title: Ask User
          default: false
        guardrail_policy_key:
          type: string
          maxLength: 64
          minLength: 1
          title: Guardrail Policy Key
          default: default
        structured_output:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Structured Output
        limits:
          $ref: '#/components/schemas/Limits'
        context_policy:
          $ref: '#/components/schemas/ContextPolicy'
        answer_rules:
          $ref: '#/components/schemas/AnswerRules'
        reasoning:
          type: string
          enum:
          - none
          - model_default
          title: Reasoning
          default: none
        runtime_profile:
          type: string
          const: default
          title: Runtime Profile
          default: default
      additionalProperties: false
      type: object
      required:
      - model
      title: AgentDefinition
    AgentKind:
      type: string
      enum:
      - native
      - external
      title: AgentKind
    AgentStatus:
      type: string
      enum:
      - draft
      - published
      - inactive
      title: AgentStatus
    AnswerRules:
      properties:
        cite_sources:
          type: boolean
          title: Cite Sources
          default: true
        unknown_reply:
          type: string
          minLength: 1
          title: Unknown Reply
          default: This information is not in the documents.
        confidence_formula:
          type: string
          enum:
          - cited
          - max
          - sentence_max
          title: Confidence Formula
          default: cited
        confidence_threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence Threshold
        show_confidence:
          type: boolean
          title: Show Confidence
          default: false
        verify:
          type: boolean
          title: Verify
          default: false
        max_answer_tokens:
          type: integer
          minimum: 16.0
          title: Max Answer Tokens
          default: 400
      additionalProperties: false
      type: object
      title: AnswerRules
    Approval:
      properties:
        actions:
          items:
            type: string
          type: array
          title: Actions
          description: '''<tool_key>.<action>''; joined with needs_approval.'
        assign_to:
          type: string
          enum:
          - analyst
          - developer
          - admin
          title: Assign To
          default: analyst
      additionalProperties: false
      type: object
      title: Approval
    ChatCompletionRequest:
      properties:
        model:
          type: string
          maxLength: 300
          minLength: 1
          title: Model
        messages:
          items:
            $ref: '#/components/schemas/ChatMessage'
          type: array
          minItems: 1
          title: Messages
        stream:
          type: boolean
          title: Stream
          default: false
        user:
          anyOf:
          - type: string
            maxLength: 320
          - type: 'null'
          title: User
        max_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Tokens
        max_completion_tokens:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Max Completion Tokens
        temperature:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: 0.0
          - type: 'null'
          title: Temperature
        top_p:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Top P
        presence_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Presence Penalty
        frequency_penalty:
          anyOf:
          - type: number
            maximum: 2.0
            minimum: -2.0
          - type: 'null'
          title: Frequency Penalty
        seed:
          anyOf:
          - type: integer
          - type: 'null'
          title: Seed
        tools:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Tools
        tool_choice:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Tool Choice
        n:
          anyOf:
          - type: integer
            maximum: 1.0
            minimum: 1.0
          - type: 'null'
          title: N
      additionalProperties: true
      type: object
      required:
      - model
      - messages
      title: ChatCompletionRequest
    ChatMessage:
      properties:
        role:
          type: string
          enum:
          - system
          - developer
          - user
          - assistant
          - tool
          title: Role
        content:
          anyOf:
          - type: string
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Content
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        tool_calls:
          anyOf:
          - items:
              additionalProperties: true
              type: object
            type: array
          - type: 'null'
          title: Tool Calls
        tool_call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tool Call Id
      additionalProperties: true
      type: object
      required:
      - role
      title: ChatMessage
    ContextPolicy:
      properties:
        history_turns:
          type: integer
          minimum: 0.0
          title: History Turns
          default: 6
        history_summarize:
          type: boolean
          title: History Summarize
          default: true
        history_max_tokens:
          type: integer
          minimum: 0.0
          title: History Max Tokens
          default: 3000
        memory_max_tokens:
          type: integer
          minimum: 0.0
          title: Memory Max Tokens
          default: 300
        rag_max_tokens:
          type: integer
          minimum: 0.0
          title: Rag Max Tokens
          default: 4000
        tools_schema_max_tokens:
          type: integer
          minimum: 0.0
          title: Tools Schema Max Tokens
          default: 1500
        output_reserve_tokens:
          type: integer
          minimum: 0.0
          title: Output Reserve Tokens
          default: 800
        trim_order:
          items:
            type: string
            enum:
            - history
            - rag
            - memory
          type: array
          maxItems: 3
          minItems: 3
          title: Trim Order
      additionalProperties: false
      type: object
      title: ContextPolicy
    ErrorBody:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorBody
      description: OpenAI-shaped error body used by every 4xx response.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: English, actionable, never contains secrets.
        type:
          type: string
          title: Type
          description: authentication_error, permission_error, not_found_error, ...
        code:
          type: string
          title: Code
          description: Stable machine-readable code, e.g. read_only_access.
      type: object
      required:
      - message
      - type
      - code
      title: ErrorDetail
    ExternalAgentCreate:
      properties:
        key:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,63}$
          title: Key
          description: Agent key, unique within the project (C1).
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        description:
          type: string
          maxLength: 2000
          title: Description
          default: ''
        base_url:
          type: string
          maxLength: 2000
          minLength: 1
          title: Base Url
          description: OpenAI-compatible base URL; /chat/completions is appended. Must pass the egress
            policy (EGRESS_ALLOWLIST, or ALLOWED_INTERNAL_HOSTS; no private address).
        model:
          type: string
          maxLength: 200
          minLength: 1
          title: Model
          description: The model name at the agent.
        api_key:
          type: string
          maxLength: 4000
          minLength: 1
          format: password
          title: Api Key
          description: Write-only.
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - key
      - name
      - base_url
      - model
      - api_key
