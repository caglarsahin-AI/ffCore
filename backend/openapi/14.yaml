openapi: 3.1.0
info:
  title: FFCore API
  description: 'User memory: the member''s own items, opt-out, administrator settings and statistics (no
    text), and the worker''s internal recall and extraction writes (package 14).'
  version: '0.14'
paths:
  /api/v1/projects/{project_id}/memories:
    get:
      tags:
      - memories
      summary: List Memories
      description: 'The caller''s own items, newest first. `ids` answers the chat''s "taken into account"
        note

        (run events carry ids only); `source_run_id` its "noted" notice.'
      operationId: list_memories_api_v1_projects__project_id__memories_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: ids
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              type: string
              format: uuid
          - type: 'null'
          title: Ids
      - name: source_run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Source Run Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - active
            - archived
            type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryList'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    post:
      tags:
      - memories
      summary: Remember
      description: '"Remember this": no extraction model, `kind=preference`, `confidence=1`; PII checked.'
      operationId: remember_api_v1_projects__project_id__memories_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
