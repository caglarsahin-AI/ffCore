components:
  schemas:
    CandidateIn:
      properties:
        kind:
          type: string
          enum:
          - profile
          - preference
          - fact
          - decision
          title: Kind
        text:
          type: string
          maxLength: 500
          minLength: 1
          title: Text
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        supersedes_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Supersedes Id
      additionalProperties: false
      type: object
      required:
      - kind
      - text
      - confidence
      title: CandidateIn
    CandidatesRequest:
      properties:
        project_id:
          type: string
          format: uuid
          title: Project Id
        user_id:
          type: string
          format: uuid
          title: User Id
        run_id:
          type: string
          format: uuid
          title: Run Id
        items:
          items:
            $ref: '#/components/schemas/CandidateIn'
          type: array
          maxItems: 3
          title: Items
      additionalProperties: false
      type: object
      required:
      - project_id
      - user_id
      - run_id
      - items
      title: CandidatesRequest
    CandidatesResponse:
      properties:
        written:
          items:
            type: string
            format: uuid
          type: array
          title: Written
        archived:
          items:
            type: string
            format: uuid
          type: array
          title: Archived
        rejected:
          additionalProperties:
            type: integer
          type: object
          title: Rejected
      type: object
      required:
      - written
      - archived
      - rejected
      title: CandidatesResponse
    ErrorBody:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorBody
      description: OpenAI-shaped error body used by every 4xx response.
    ErrorDetail:
      properties:
        message:
          type: string
          title: Message
          description: English, actionable, never contains secrets.
        type:
          type: string
          title: Type
          description: authentication_error, permission_error, not_found_error, ...
        code:
          type: string
          title: Code
          description: Stable machine-readable code, e.g. read_only_access.
      type: object
      required:
      - message
      - type
      - code
      title: ErrorDetail
    MemoryList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/MemoryOut'
          type: array
          title: Items
      type: object
      required:
      - items
      title: MemoryList
    MemoryOut:
      properties:
        id:
          type: string
          format: uuid
