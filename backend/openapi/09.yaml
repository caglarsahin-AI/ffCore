  /api/v1/projects/{project_id}/eval-runs/compare:
    get:
      tags:
      - evaluation
      summary: Compare Eval Runs
      description: 'Item by item difference of two completed exams of one suite (09-2), read from FFCore''s

        own results; not-run items are `not_comparable`. Declared before `/eval-runs/{id}`.'
      operationId: compare_eval_runs_api_v1_projects__project_id__eval_runs_compare_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: a
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: The exam compared against (earlier).
          title: A
        description: The exam compared against (earlier).
      - name: b
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: The exam compared (later).
          title: B
        description: The exam compared (later).
      responses:
        '200':
          description: Successful Response
          content:
