        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/projects/{project_id}/eval-suites/{suite_id}/items/from-run/{run_id}:
    post:
      tags:
      - evaluation
      summary: Item From Run
      description: 'Save a run''s question as an item of the suite''s dataset with the expected answer
        given

        here (09-2). The question, its variables and the expected output are masked by the agent

        version''s egress policy first (`masking` says how); a blocked text is 422

        `run_input_blocked`, a policy error a coded 422, the NER 503. The run is read as the run API

        reads it. Audited once (`eval_item_from_run`), without content; a refusal too, with its

        code (r1 MINOR-5).'
      operationId: item_from_run_api_v1_projects__project_id__eval_suites__suite_id__items_from_run__run_id__post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Suite Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromRunItem'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FromRunOut'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Role or access mode not sufficient, or cross-origin request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: The Langfuse call failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: The NER the egress policy needs is unavailable (`ner_unavailable`) or not configured
            (`ner_not_configured`, `model_missing`, ...), or Langfuse is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
