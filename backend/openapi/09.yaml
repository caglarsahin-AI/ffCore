      tags:
      - evaluation
      summary: Stream Eval Run
      description: 'Server-sent `progress` events (`status`, `items`, `scored`) until the exam ends, then

        one `done` with the status and `passed`. The stream only reads; closing it changes nothing.'
      operationId: stream_eval_run_api_v1_projects__project_id__eval_runs__eval_run_id__stream_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: eval_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Eval Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Not authenticated.
          content:
            application/json:
