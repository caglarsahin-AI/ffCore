        '409':
          description: Conflict with the current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '422':
          description: Request body or parameters failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
components:
  schemas:
    CompareItem:
      properties:
        item_id:
          type: string
          title: Item Id
        style:
          type: string
          title: Style
        change:
          type: string
          enum:
          - fixed
          - regressed
          - same
          - not_comparable
          - only_a
          - only_b
          title: Change
        a:
          anyOf:
          - $ref: '#/components/schemas/CompareSide'
          - type: 'null'
        b:
          anyOf:
          - $ref: '#/components/schemas/CompareSide'
          - type: 'null'
        mean_delta:
          anyOf:
          - type: number
          - type: 'null'
          title: Mean Delta
