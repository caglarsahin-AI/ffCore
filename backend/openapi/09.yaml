  /api/v1/projects/{project_id}/eval-runs/{eval_run_id}/items:
    get:
      tags:
      - evaluation
      summary: List Eval Run Items
      description: 'The exam''s items, one page (10c-2, FOLLOWUP-185): each combined from its runs like
        the

        summary and compare (FFCore''s own results, no Langfuse call); failed, not run, passed, not

        yet scored, then by item id.'
      operationId: list_eval_run_items_api_v1_projects__project_id__eval_runs__eval_run_id__items_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: eval_run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Eval Run Id
      - name: status
        in: query
        required: false
        schema:
          enum:
          - all
          - failed
          - passed
          - not_run
          type: string
          description: Which items (default all).
          default: all
          title: Status
        description: Which items (default all).
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
