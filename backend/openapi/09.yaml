      - evaluation
      summary: List Suites
      operationId: list_suites_api_v1_projects__project_id__eval_suites_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
