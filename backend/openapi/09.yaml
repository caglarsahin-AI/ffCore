            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
  /api/v1/projects/{project_id}/eval-suites/{suite_id}/items/from-run/{run_id}:
    post:
      tags:
      - evaluation
      summary: Item From Run
      description: 'Save a run''s question as an item of the suite''s dataset with the expected answer
        given

        here (09-2). The question and its variables are masked by the agent version''s egress policy

        first; a blocked one is 422 `run_input_blocked`. The run is read as the run API reads it.

        Audited once (`eval_item_from_run`), without content.'
      operationId: item_from_run_api_v1_projects__project_id__eval_suites__suite_id__items_from_run__run_id__post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: suite_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Suite Id
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FromRunItem'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
